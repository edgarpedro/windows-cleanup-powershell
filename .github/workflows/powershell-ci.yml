name: PowerShell CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Display PowerShell version
        shell: powershell
        run: |
          $PSVersionTable

      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          [Net.ServicePointManager]::SecurityProtocol = `
              [Net.ServicePointManager]::SecurityProtocol -bor `
              [Net.SecurityProtocolType]::Tls12

          Install-Module `
              -Name Pester `
              -RequiredVersion 5.7.1 `
              -Scope CurrentUser `
              -Force `
              -SkipPublisherCheck

          Import-Module `
              -Name Pester `
              -RequiredVersion 5.7.1 `
              -Force

          Get-Module -Name Pester |
              Select-Object Name, Version, Path

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parseErrors = @()

          $files = @(
              Get-ChildItem `
                  -LiteralPath $env:GITHUB_WORKSPACE `
                  -Recurse `
                  -File |
              Where-Object {
                  $_.Extension -in @('.ps1', '.psm1')
              }
          )

          foreach ($file in $files) {
              $tokens = $null
              $errors = $null

              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$errors
              )

              foreach ($parseError in $errors) {
                  $parseErrors += [pscustomobject]@{
                      File    = $file.FullName
                      Line    = $parseError.Extent.StartLineNumber
                      Column  = $parseError.Extent.StartColumnNumber
                      Message = $parseError.Message
                  }
              }
          }

          if ($parseErrors.Count -gt 0) {
              $parseErrors |
                  Format-Table -AutoSize |
                  Out-String |
                  Write-Host

              throw "$($parseErrors.Count) PowerShell syntax error(s) found."
          }

          Write-Host "Syntax validation passed for $($files.Count) file(s)."

      - name: Run Pester tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module `
              -Name Pester `
              -RequiredVersion 5.7.1 `
              -Force

          $configuration = New-PesterConfiguration

          $configuration.Run.Path = @(
              '.\tests\WindowsCleanup.Tests.ps1'
          )

          $configuration.Run.PassThru = $true
          $configuration.Run.Exit = $false
          $configuration.Output.Verbosity = 'Detailed'

          $result = Invoke-Pester `
              -Configuration $configuration

          Write-Host "Passed:  $($result.PassedCount)"
          Write-Host "Failed:  $($result.FailedCount)"
          Write-Host "Skipped: $($result.SkippedCount)"

          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }
